<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vocab Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="tabs-wrap">
      <button id="tabLearn" class="active">Learn</button>
      <button id="tabTable">词库</button>
      <button id="tabFav">收藏</button>
    </div>
    <button class="icon-btn" id="btnLearnManage" title="批量管理 Learn" aria-label="批量管理 Learn" style="display:none;">☰</button>
    <button class="icon-btn" id="btnSettings">⚙️</button>
  </header>

  <main id="mainCard">
    <div class="card" id="card">
      <div class="en" id="en">请导入词库</div>
      <div class="phonetic hide" id="phonetic"></div>
      <div class="zh hide" id="zh"></div>
      <div class="nav-hint">← 点击左侧回看 ｜ 点击右侧继续 →</div>
    </div>
  </main>
  <div class="stat" id="stat"></div>

  <div class="table-list" id="mainTable">
    <div class="table-header">
      <div class="toolbar toolbar-main">
        <input type="text" class="search-bar" id="searchTable" placeholder="🔍 搜索词库...">
        <div class="draw-group">
          <input type="number" id="inputRandomCount" placeholder="数量" min="1" inputmode="numeric" aria-label="抽取数量">
          <button class="btn-primary btn-draw" id="btnRandomDraw">🎲 抽取</button>
        </div>
      </div>
      <div class="toolbar toolbar-sub">
        <div class="toolbar-left">
          <button class="btn-small" id="btnToggleSelectMode">多选</button>
          <button class="btn-small" id="btnSelectAll" style="display: none;">全选</button>
          <button class="btn-small btn-danger" id="btnBatchDelete" style="display: none;">删除</button>
          <select class="batch-select" id="batchFavTarget" style="display: none;"></select>
          <button class="btn-small" id="btnBatchAddFav" style="display: none;">加入</button>
        </div>
        <span class="table-meta" id="tableMeta"></span>
        <button class="icon-action" id="btnClearLearn" title="清空 Learn 队列" aria-label="清空 Learn 队列">🗑️</button>
      </div>
    </div>
    <div class="table-content" id="tableListContent"></div>
  </div>

  <div class="table-list" id="mainFavList">
    <div class="table-header">
      <div class="table-header-row fav-list-head">
        <div class="fav-list-title">
          <h2 class="section-title">我的收藏夹</h2>
          <div class="fav-hint">长按或右键文件夹可重命名 / 管理 / 删除</div>
        </div>
        <button class="btn-primary btn-inline btn-compact" id="btnCreateFolder">+ 新建</button>
      </div>
    </div>
    <div class="table-content" id="favListContent"></div>
  </div>

  <div class="table-list" id="mainFavManage">
    <div class="table-header">
      <div class="table-header-row" style="justify-content: space-between; margin-bottom: 5px;">
        <button class="btn-small" id="btnBackToFavList">← 返回目录</button>
        <h3 style="margin:0; font-size: 16px;" id="favManageTitle">管理夹子</h3>
      </div>
      <input type="text" class="search-bar" id="searchFav" placeholder="🔍 搜索当前夹子...">
      <div class="table-header-row fav-manage-actions">
        <button class="btn-small" id="btnFavSelectAll">全选</button>
        <button class="btn-small" id="btnShuffleFav" style="color: var(--yellow); border-color: var(--yellow);">🔀 打乱</button>
        <select class="batch-select" id="favMoveTarget" style="flex: 1;"></select>
        <button class="btn-small" id="btnBatchMoveFav" style="color: var(--blue); border-color: var(--blue);">转移</button>
        <button class="btn-small btn-danger" id="btnBatchRemoveFav">移除</button>
      </div>
    </div>
    <div class="table-content" id="favManageContent"></div>
  </div>

  <div class="table-list" id="mainLearnManage">
    <div class="table-header">
      <div class="table-header-row learn-manage-head">
        <button class="btn-small" id="btnBackFromLearnManage">← 返回卡片</button>
        <h3 class="learn-manage-title">批量管理 Learn</h3>
      </div>
      <div class="table-header-row learn-manage-actions">
        <button class="btn-small" id="btnLearnSelectAll">全选</button>
        <button class="btn-small" id="btnLearnDeselectAll">取消全选</button>
        <button class="btn-small btn-danger" id="btnLearnBatchRemove" disabled>移出选中 (0)</button>
      </div>
    </div>
    <div class="table-content" id="learnManageContent"></div>
  </div>

  <!-- 底部操作：收藏 / 移出 Learn / 发音 -->
  <footer id="mainFooter">
    <button class="action-btn btn-fav" id="btnFav">☆</button>
    <button class="action-btn btn-remove-learn" id="btnRemoveLearn" title="移出当前单词" aria-label="移出当前单词">❌ 移出学习</button>
    <button class="action-btn btn-speak" id="btnSpeak">🔊</button>
  </footer>

  <div class="modal" id="modalImport">
    <div class="modal-inner">
      <h3 style="margin-top:0;">导入单词本</h3>
      <input type="file" id="fileInput" accept=".txt,.csv,.pdf,.docx,.doc" style="display: none;" />
      <button class="btn-primary" id="btnUploadFile" style="background: var(--border); color: var(--text); margin-bottom: 10px;">📁 选择本地文件</button>
      <div style="font-size: 12px; color: var(--sub); margin-bottom: 10px;">支持 .txt / .csv / .pdf / .docx</div>
      <textarea id="ta" placeholder="粘贴脏文本，或开启自动清洗..."></textarea>
      <div id="cleanStatus" style="font-size: 12px; color: var(--sub); margin-bottom: 10px;">就绪</div>
      <div id="preview" style="font-size: 12px; color: var(--blue); margin-bottom: 10px; max-height: 60px; overflow: auto;"></div>
      <button class="btn-primary" id="btnCleanDS" style="background: var(--border); color: var(--text);">✨ AI 自动清洗</button>
      <button class="btn-primary" id="btnParse">直接导入</button>
      <button class="btn-text" id="btnCancelImport">取消</button>
    </div>
  </div>

  <div class="modal" id="modalSettings">
    <div class="modal-inner" style="max-width: 500px; padding: 24px;">
      <div class="setting-row" style="padding-top: 0;">
        <span>主题外观</span>
        <div class="theme-switch">
          <button id="themeLight">☀️ 浅色</button>
          <button id="themeDark">🌙 深色</button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px;">
        <h3 style="margin:0; font-size: 18px;">API Keys <span style="font-size: 12px; color: var(--green); font-weight: normal;">🔒 加密</span></h3>
        <button class="btn-primary" id="btnCreateApi" style="width: auto; padding: 6px 16px; margin: 0; font-size: 14px;">+ 创建</button>
      </div>
      
      <table class="api-table">
        <thead><tr><th>API Key</th><th>状态</th><th style="text-align: right;">操作</th></tr></thead>
        <tbody id="apiListBody"></tbody>
      </table>

      <div class="setting-row" style="margin-top: 15px;">
        <span>总是显示中文</span>
        <input type="checkbox" id="chkAlwaysZh" style="width: 20px; height: 20px;">
      </div>
      <div class="setting-row">
        <span>粘贴后自动 AI 清洗并导入</span>
        <input type="checkbox" id="chkAutoClean" style="width: 20px; height: 20px;">
      </div>

      <hr style="border:0; border-top:1px solid var(--border); margin: 15px 0;">
      <button class="btn-text" id="btnOpenImport" style="color:var(--blue);">导入新单词</button>
      <button class="btn-text" id="btnReset" style="color:var(--red);">重置当前进度</button>
      
      <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
        <button class="btn-text" id="btnCloseSettings" style="width: auto; padding: 8px 16px; background: var(--border); border-radius: 8px; color: var(--text);">关闭</button>
      </div>
    </div>
  </div>

  <!-- 收藏夹选择：手机底部抽屉 / PC 居中弹窗 -->
  <div class="modal sheet-modal" id="modalFavPicker" role="dialog" aria-modal="true" aria-labelledby="favPickerTitle">
    <div class="modal-inner sheet-inner">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3 id="favPickerTitle">收藏到…</h3>
        <button class="icon-btn sheet-close" data-close="modalFavPicker" aria-label="关闭">✕</button>
      </div>
      <div class="fav-pick-list" id="favPickList"></div>
      <div class="fav-new-wrap" id="favPickNewWrap" hidden>
        <input type="text" class="search-bar" id="favPickNewName" maxlength="40" placeholder="新收藏夹名称">
        <div class="sheet-actions">
          <button class="btn-small" id="btnFavPickNewCancel">取消</button>
          <button class="btn-primary btn-inline" id="btnFavPickNewConfirm">创建并收藏</button>
        </div>
      </div>
      <button class="btn-text sheet-new-btn" id="btnFavPickNew">＋ 新建收藏夹</button>
    </div>
  </div>

  <!-- 文件夹长按/右键菜单 -->
  <div class="modal sheet-modal" id="modalFolderMenu" role="dialog" aria-modal="true" aria-labelledby="folderMenuTitle">
    <div class="modal-inner sheet-inner">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3>文件夹操作</h3>
        <button class="icon-btn sheet-close" data-close="modalFolderMenu" aria-label="关闭">✕</button>
      </div>
      <div class="sheet-subtitle" id="folderMenuTitle"></div>
      <div class="menu-list">
        <button class="menu-item" id="btnFolderRename">✏️ 重命名</button>
        <button class="menu-item" id="btnFolderManage">⚙️ 管理单词</button>
        <button class="menu-item menu-danger" id="btnFolderDelete">🗑️ 删除收藏夹</button>
      </div>
    </div>
  </div>

  <!-- 新建 / 重命名收藏夹（替代 prompt） -->
  <div class="modal sheet-modal" id="modalFolderEdit" role="dialog" aria-modal="true" aria-labelledby="folderEditTitle">
    <div class="modal-inner sheet-inner">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3 id="folderEditTitle">新建收藏夹</h3>
        <button class="icon-btn sheet-close" data-close="modalFolderEdit" aria-label="关闭">✕</button>
      </div>
      <input type="text" class="search-bar" id="folderEditInput" maxlength="40" placeholder="收藏夹名称">
      <div class="sheet-actions">
        <button class="btn-small" id="btnFolderEditCancel">取消</button>
        <button class="btn-primary btn-inline" id="btnFolderEditConfirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 新建 API Key（替代 prompt） -->
  <div class="modal sheet-modal" id="modalApiKey" role="dialog" aria-modal="true" aria-labelledby="apiKeyTitle">
    <div class="modal-inner sheet-inner">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3 id="apiKeyTitle">新建 API Key</h3>
        <button class="icon-btn sheet-close" data-close="modalApiKey" aria-label="关闭">✕</button>
      </div>
      <input type="password" class="search-bar" id="apiKeyInput" autocomplete="off" placeholder="sk-...">
      <div class="sheet-actions">
        <button class="btn-small" id="btnApiKeyCancel">取消</button>
        <button class="btn-primary btn-inline" id="btnApiKeyConfirm">保存</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
